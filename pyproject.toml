[project]
name = "hua2024-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "waragent-tools",
]

[tool.uv.workspace]
members = ["tools"]

[tool.uv.sources]
waragent-tools = { workspace = true }
# runvault の Python 側 (run ディレクトリの解決と読み出し)．Rust 側と同じ
# リポジトリの python/ サブディレクトリにある．
runvault = { git = "https://github.com/akitenkrad/rs-runvault", subdirectory = "python" }
